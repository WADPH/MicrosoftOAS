<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAS HR</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="topbarLeft">
          <a href="/" class="topbarBrand" aria-label="Home">
            <img class="logoLight" src="/images/oas-light.png" alt="OAS" />
            <img class="logoDark" src="/images/oas.png" alt="OAS" />
          </a>
        </div>
        <div class="topbarRight">
          <div class="toolbarGroup">
            <button id="hrProgressBtn" class="ghost small" type="button">Progress</button>
            <div class="toolbarLabel">Theme</div>
            <button id="themeBtn" class="iconBtn" type="button" aria-label="Toggle theme" title="Toggle theme">
              <span class="icon sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Z" />
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                </svg>
              </span>
              <span class="icon moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z" />
                </svg>
              </span>
            </button>
          </div>
          <div class="toolbarGroup userGroup">
            <div class="toolbarLabel" id="hrUserEmail">-</div>
            <div class="separator"></div>
            <button id="hrLogoutBtn" class="logoutBtn" type="button" title="Logout">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5m5 5H9" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <section class="progressScreen" aria-live="polite">
       <div class="progressCard hrCard">
        <h2>HR Requests</h2>

        <div class="tasksTabs">
          <button id="hrTabOnboardingBtn" class="ghost small active" type="button">Onboarding</button>
          <button id="hrTabOffboardingBtn" class="ghost small" type="button">Offboarding</button>
        </div>

        <div id="hrOnboardingForm" class="sectionCard">
          <div class="sectionHeader">
            <h3>New Onboarding Request</h3>
            <p class="metaSmall">Submit a new employee for onboarding</p>
          </div>

          <div class="grid2">
            <div class="field">
              <label for="hrFirstName">Name</label>
              <input id="hrFirstName" type="text" />
            </div>
            <div class="field">
              <label for="hrLastName">Surname</label>
              <input id="hrLastName" type="text" />
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label for="hrOnboardingCompany">Company</label>
              <select id="hrOnboardingCompany"></select>
            </div>
            <div class="field">
              <label for="hrPosition">Position</label>
              <input id="hrPosition" type="text" />
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label for="hrPhone">Mobile Number</label>
              <input id="hrPhone" type="text" />
            </div>
            <div class="field">
              <label for="hrStartDate">Date</label>
              <input id="hrStartDate" type="date" autocomplete="off" />
            </div>
          </div>

          <div class="field">
            <label for="hrManager">Line Manager</label>
            <div class="inlineRow">
              <input id="hrManager" class="inlineRowFill" type="text" readonly placeholder="Not selected" />
              <button id="hrChooseManagerBtn" type="button" class="ghost small" disabled>Choose</button>
            </div>
          </div>

          <div id="hrOnboardingTeamsSection" class="hidden">
            <div class="sectionDivider"></div>
            <div class="field">
              <label for="hrOnboardingTeamsNote">Teams Notification</label>
              <textarea id="hrOnboardingTeamsNote" rows="3" placeholder="Optional message (no mentions required)"></textarea>
            </div>
            <div id="hrOnboardingMentions" class="mentionList"></div>
            <div class="field">
              <button id="hrAddOnboardingMentionBtn" type="button" class="ghost small">Add mention</button>
            </div>
          </div>

          <div class="actions">
            <button id="hrOnboardingSubmitBtn" type="button" class="primary">Create Onboarding Task</button>
          </div>
          <p id="hrOnboardingStatus" class="meta"></p>
        </div>

        <div id="hrOffboardingForm" class="sectionCard hidden">
          <div class="sectionHeader">
            <h3>New Offboarding Request</h3>
            <p class="metaSmall">Submit a departing employee for offboarding</p>
          </div>

          <div class="field">
            <label for="hrOffboardingCompany">Company</label>
            <select id="hrOffboardingCompany"></select>
          </div>

          <div class="field">
            <label>Employee</label>
            <div class="inlineRow">
              <div id="hrOffboardingEmployee" class="managerEmpty inlineRowFill">Not selected</div>
              <button id="hrChooseEmployeeBtn" type="button" class="ghost small" disabled>Choose Employee</button>
            </div>
          </div>

          <div class="field">
            <label for="hrOffboardingDate">Date</label>
            <input id="hrOffboardingDate" type="date" autocomplete="off" />
          </div>

          <div id="hrOffboardingTeamsSection" class="hidden">
            <div class="sectionDivider"></div>
            <div class="field">
              <label for="hrOffboardingTeamsNote">Teams Notification</label>
              <textarea id="hrOffboardingTeamsNote" rows="3" placeholder="Optional message (no mentions required)"></textarea>
            </div>
            <div id="hrOffboardingMentions" class="mentionList"></div>
            <div class="field">
              <button id="hrAddOffboardingMentionBtn" type="button" class="ghost small">Add mention</button>
            </div>
          </div>

          <div class="actions">
            <button id="hrOffboardingSubmitBtn" type="button" class="primary">Create Offboarding Task</button>
          </div>
          <p id="hrOffboardingStatus" class="meta"></p>
        </div>
       </div>
      </section>
    </div>

    <div id="hrUserModal" class="modal hidden" aria-hidden="true">
      <div id="hrUserModalOverlay" class="modalOverlay"></div>
      <div class="modalContent" role="dialog" aria-modal="true" aria-labelledby="hrUserModalTitle">
        <div class="modalHeader">
          <div>
            <h3 id="hrUserModalTitle">Choose User</h3>
            <p class="metaSmall">Search tenant users by name or email.</p>
          </div>
          <button id="hrUserModalClose" type="button" aria-label="Close">×</button>
        </div>
        <div class="field">
          <label for="hrUserSearch">Search users</label>
          <input id="hrUserSearch" type="search" placeholder="Type name or email" />
        </div>
        <div id="hrUserList" class="managerList"></div>
        <p id="hrUserModalError" class="meta"></p>
      </div>
    </div>

    <div id="hrSuccessModal" class="modal hidden" aria-hidden="true">
      <div id="hrSuccessModalOverlay" class="modalOverlay"></div>
      <div class="modalContent" role="dialog" aria-modal="true" aria-labelledby="hrSuccessModalTitle">
        <div class="progressComplete">
          <div class="completeIcon hrSuccessIcon">✓</div>
          <h4 id="hrSuccessModalTitle">Task Created</h4>
          <p id="hrSuccessModalMessage" class="metaSmall"></p>
        </div>
        <div class="actions">
          <button id="hrSuccessModalClose" type="button" class="primary pushRight">Close</button>
        </div>
      </div>
    </div>

    <script src="/hr.js"></script>
  </body>
</html>
